-- lens-hub.example.cfg: copy to /home/lens-hub.cfg and edit. Every key is optional; docs/hub.md has them all.
-- Queries are explained in docs/queries.md. Every series has a node label: node="prism-ore" picks one agent.
return {
  node  = "hub",     -- this hub's name
  port  = 4243,      -- LENS port: the agents' lensPort. Not PRISM's control-screen port
  token = nil,       -- shared secret: set the same lensToken on every agent. nil = none

  staleAfter = 3,    -- missed snapshots before a node counts as stopped reporting
  beep       = true, -- beep when a new bad alert appears
  sample     = 10,   -- seconds between the panels' sparkline samples

  -- Agents whose silence is only a warning, and which don't count towards overall health.
  nonCritical = { },

  -- The dashboard's panels. value = a query; then one of:
  --   max = N   a bar of value / N        of = query   "value/of" and a bar of value / of
  --   percent = true   value is 0..1, shown as %
  -- unit = text after the value; warnAbove / badAbove / warnBelow / badBelow color it.
  panels = {
    { label = "Ore backlog", value = 'sum(prism_backlog_items{node="prism-ore"})',
      max = 10000, unit = "items", warnAbove = 5000, badAbove = 9000 },
    { label = "Ore machines running", value = 'sum(prism_machine_state{node="prism-ore", state="running"})',
      of = 'count(prism_machine_state{node="prism-ore", state="running"})' },
    { label = "Ore machines down", value = 'sum(prism_machine_state{node="prism-ore", state="down"})',
      warnAbove = 1, badAbove = 3 },
  },

  -- The AR glasses HUD (an OC Glasses Glasses Terminal on this computer). hud = false turns it off.
  -- colors: "float" (0..1) or "byte" (0..255): lens-discover --glasses-test shows which your terminal takes.
  hud = { x = 4, y = 4, width = 150, scale = 1, alerts = 3, colors = "float" },

  -- The hub's own alerts: when a query is true (non-zero) for `for` seconds.
  rules = {
    { id = "ore-backlog", level = "warn", text = "Ore backlog over 9k for 5 minutes",
      when = 'sum(prism_backlog_items{node="prism-ore"}) > 9000', ["for"] = 300 },
  },
}
