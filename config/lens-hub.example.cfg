-- lens-hub.example.cfg: an annotated example. lens-setup writes /home/lens-hub.cfg for you (and offers each
-- agent's panels); or copy this there and edit it. Every key is optional; docs/hub.md has them all.
-- Queries are explained in docs/queries.md. Every series has a node label: node="prism-ore" picks one agent.
return {
  node  = "hub",     -- this hub's name
  port  = 4243,      -- LENS port: the agents' lensPort. Not PRISM's control-screen port
  token = nil,       -- shared secret: set the same lensToken on every agent. nil = none

  staleAfter = 3,    -- missed snapshots before a node counts as stopped reporting
  beep       = true, -- beep when a new bad alert appears
  sample     = 10,   -- seconds between the panels' sparkline samples
  resolution = "fit", -- "fit" the screen's shape, "max", or { width, height } for bigger text

  -- Who may change the dashboard on the screen (EDIT): player names. nil = anyone. What's changed there is
  -- saved in lens-board.cfg, never here.
  editors = nil,

  -- Agents whose silence is only a warning, and which don't count towards overall health.
  nonCritical = { },

  -- The dashboard's panels. value = a query; then one of:
  --   max = N   a bar of value / N        of = query   "value/of" and a bar of value / of
  --   format = "percent"   value is 0..1, shown as %, with a bar
  -- format = "auto" (4.2k) | "percent" | "duration" (2h 05m) | "signed" (+2.4k); unit = text after the value;
  -- color = "thresholds" (warnAbove / badAbove / warnBelow / badBelow) | "sign" (green +, red -) | "none".
  -- text = "{a} / {b}" with values = { a = query, b = query }: several values in one line.
  -- dots = selector (by = label, default "machine"): a dot per machine, colored by state.
  -- when = query: shown only while it's true.
  panels = {
    { label = "Ore backlog", value = 'sum(prism_backlog_items{node="prism-ore"})',
      max = 10000, unit = "items", warnAbove = 5000, badAbove = 9000 },
    { label = "Ore machines running", value = 'sum(prism_machine_state{node="prism-ore", state="running"})',
      of = 'count(prism_machine_state{node="prism-ore", state="running"})' },
    { label = "Ore machines down", value = 'sum(prism_machine_state{node="prism-ore", state="down"})',
      warnAbove = 1, badAbove = 3 },
    { label = "Ore line", dots = 'prism_machine_state{node="prism-ore"}' },
  },

  -- The AR glasses HUD (OC Glasses Glasses Terminals on this computer; one per player gives each their own,
  -- set up on the dashboard: tap HUD). This is everyone's default. Blocks of elements: bar and text take a
  -- panel's keys; alerts shows the newest; gap is half a row. anchor: top-left, top, top-right, left, center,
  -- right, bottom-left, bottom, bottom-right; x, y: GUI pixels from it, right and down positive (default 4 in
  -- from the edges). scale 2 doubles text (double width too). hud = false turns it off.
  hud = {
    scale = 1,
    blocks = {
      { anchor = "top-right", width = 160, elements = {
        { kind = "bar", label = "Ore", value = 'sum(prism_backlog_items{node="prism-ore"})', max = 10000,
          warnAbove = 5000, badAbove = 9000 },
        { kind = "alerts", count = 3 },
      } },
    },
  },

  -- The hub's own alerts: when a query is true (non-zero) for `for` seconds.
  rules = {
    { id = "ore-backlog", level = "warn", text = "Ore backlog over 9k for 5 minutes",
      when = 'sum(prism_backlog_items{node="prism-ore"}) > 9000', ["for"] = 300 },
  },
}
